server {
  listen 3030;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Access-Control-Allow-Origin "*" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'" always;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(js|css|json|svg|woff2?)$ {
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
}
