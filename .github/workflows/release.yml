name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm install --no-audit --no-fund
      - run: npm run build:mf

      - name: Prepare Pages (latest + versioned)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p _site/"$TAG"
          cp -r dist/* _site/"$TAG"/
          cp -r dist/* _site/
          echo "{\"tag\":\"$TAG\",\"remoteEntry\":\"remoteEntry.js\"}" > _site/mf-info.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Attach dist to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/remoteEntry.js
            dist/mf-manifest.json
          generate_release_notes: true
